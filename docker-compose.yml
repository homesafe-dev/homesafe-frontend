version: "3.8"

services:
  frontend-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ayorinde3/homesafe-frontend-app-image:v1.0.0
    container_name: homesafe-frontend-app-container
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - homesafe-frontend-network

networks:
  homesafe-frontend-network:
    driver: bridge